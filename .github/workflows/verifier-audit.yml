name: Verifier contract and setup regression
on:
  push:
    branches: [engineering]
    paths:
      - 'services/email-verifier/**'
      - 'app/lib/email/**'
      - 'shared-hosting/private/**'
      - 'shared-hosting/public/assets/verification-connection.js'
      - 'tests/verifier-audit.test.mjs'
      - 'scripts/test-verifier-audit.sh'
      - '.github/workflows/verifier-audit.yml'
  pull_request:
    paths:
      - 'services/email-verifier/**'
      - 'app/lib/email/**'
      - 'shared-hosting/**'
      - 'tests/verifier-audit.test.mjs'
      - 'scripts/test-verifier-audit.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl
          coverage: none
      - name: Install locked development tools without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit
      - name: Cross-language verification contracts; synthetic fixtures only
        run: sh scripts/test-verifier-audit.sh
